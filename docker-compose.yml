services:
  immich-pet-tagger:
    image: ghcr.io/tedornitier/immich-pet-tagger:cpu
    # build: section below is only needed if you want to build from source instead of pulling the image
    build:
      context: .
      args:
        XPU: "false"  # set to "true" for Intel GPU acceleration (integrated or discrete)
    container_name: immich-pet-tagger
    restart: unless-stopped
    ports:
      - "127.0.0.1:2287:8000"
    environment:
      - IMMICH_URL=http://immich-server:2283      # name of your Immich container
      - IMMICH_API_KEY=your_api_key_here          # generate in Immich: Account Settings, API Keys. Keep this secret.
      - IMMICH_EXTERNAL_URL=http://localhost:2283 # how your browser reaches Immich
      - POLL_INTERVAL=300
      - GPU_WORKERS=1
      - YOLO_INPUT_SIZE=640
      - THRESHOLD=0.8
    # Uncomment and configure the section below to enable Intel GPU acceleration.
    # Requires Intel GPU drivers on the host and XPU=true in the build args.
    # Example for Intel GPU:
    #   build:
    #     context: .
    #     args:
    #       XPU: "true"
    #   devices:
    #     - /dev/dri:/dev/dri
    #   group_add:
    #     - video
    #   environment:
    #     - GPU_WORKERS=2
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    volumes:
      - ./data:/data
      - model_cache:/root/.cache
    networks:
      - immich_default  # must match the network name below

volumes:
  model_cache:

networks:
  immich_default:       # set to your Immich Docker network name (docker network ls)
    external: true      # this network is created by Immich's compose, not this one
